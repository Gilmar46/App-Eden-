name: Publicar App Eden Web para iPhone

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publicar-app-eden-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eden-github-pages
  cancel-in-progress: true

jobs:
  publicar:
    name: Publicar App Eden Web
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicativo web
        run: npm run build -- --base=/App-Eden-/

      - name: Verificar aplicativo compilado
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest

      - name: Preparar publicacao
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
