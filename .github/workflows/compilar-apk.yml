name: Compilar APK App Eden

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compilar-apk:
    name: Gerar APK Android Assinado
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependências do App Éden
        run: npm ci

      - name: Instalar Capacitor e login Google
        run: |
          npm install --no-save \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capacitor-firebase/authentication@8

      - name: Criar configuração Android
        run: |
          cat > capacitor.config.ts <<'EOF'
          /// <reference types="@capacitor-firebase/authentication" />

          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.jsonia.appeden',
            appName: 'App Éden',
            webDir: 'dist',

            server: {
              androidScheme: 'https'
            },

            android: {
              allowMixedContent: false
            },

            plugins: {
              FirebaseAuthentication: {
                skipNativeAuth: true,
                providers: ['google.com']
              }
            }
          };

          export default config;
          EOF

      - name: Adaptar login Google para Android
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          app_path = Path("src/App.tsx")

          if not app_path.exists():
              raise SystemExit(
                  "ERRO: src/App.tsx não foi encontrado."
              )

          text = app_path.read_text(encoding="utf-8")

          # Localizar o import atual do Firebase Authentication.
          auth_import_pattern = re.compile(
              r"import\s*\{[^}]*\}\s*"
              r"from\s*['\"]firebase/auth['\"]\s*;",
              re.DOTALL
          )

          auth_match = auth_import_pattern.search(text)

          if not auth_match:
              raise SystemExit(
                  "ERRO: import do Firebase Auth não foi encontrado."
              )

          old_auth_import = auth_match.group(0)

          required_names = [
              "signInWithPopup",
              "GoogleAuthProvider",
              "signOut",
              "onAuthStateChanged",
              "FirebaseUser"
          ]

          for name in required_names:
              if name not in old_auth_import:
                  raise SystemExit(
                      f"ERRO: {name} não foi encontrado "
                      "no import do Firebase Auth."
                  )

          new_auth_import = """import {
            signInWithPopup,
            signInWithCredential,
            GoogleAuthProvider,
            signOut,
            onAuthStateChanged,
            User as FirebaseUser
          } from 'firebase/auth';
          import { Capacitor } from '@capacitor/core';
          import {
            FirebaseAuthentication
          } from '@capacitor-firebase/authentication';"""

          text = (
              text[:auth_match.start()]
              + new_auth_import
              + text[auth_match.end():]
          )

          # Função de login compatível com Android e navegador.
          # Também apresenta na tela qualquer erro encontrado.
          helper = """
          const describeGoogleAuthError = (error: unknown) => {
            const authError = error as {
              code?: string;
              message?: string;
            };

            return {
              code: authError?.code || 'sem código',
              message:
                authError?.message ||
                String(error) ||
                'Erro desconhecido'
            };
          };

          const signInWithGoogleCompat = async () => {
            try {
              if (Capacitor.isNativePlatform()) {
                if (
                  !Capacitor.isPluginAvailable(
                    'FirebaseAuthentication'
                  )
                ) {
                  throw new Error(
                    'O plugin FirebaseAuthentication não está ' +
                    'disponível neste APK.'
                  );
                }

                const result =
                  await FirebaseAuthentication.signInWithGoogle({
                    skipNativeAuth: true
                  });

                const idToken =
                  result.credential?.idToken;

                if (!idToken) {
                  throw new Error(
                    'O Google não forneceu o token de identificação.'
                  );
                }

                const credential =
                  GoogleAuthProvider.credential(idToken);

                await signInWithCredential(
                  auth,
                  credential
                );

                return;
              }

              const provider =
                new GoogleAuthProvider();

              await signInWithPopup(
                auth,
                provider
              );
            } catch (error) {
              const details =
                describeGoogleAuthError(error);

              console.error(
                'Erro completo do login Google:',
                error
              );

              window.alert(
                'Falha no login Google.\\n\\n' +
                'Código: ' + details.code + '\\n\\n' +
                'Mensagem: ' + details.message
              );

              throw error;
            }
          };

          """

          marker = "// --- Main App ---"

          if marker not in text:
              raise SystemExit(
                  "ERRO: marcador principal do aplicativo "
                  "não foi encontrado."
              )

          text = text.replace(
              marker,
              helper + marker,
              1
          )

          # Alterar o botão da tela inicial.
          login_view_pattern = re.compile(
              r"const handleLogin = async \(\) => \{\s*"
              r"const provider = new GoogleAuthProvider\(\);\s*"
              r"try \{\s*"
              r"await signInWithPopup\(auth,\s*provider\);"
          )

          login_view_replacement = """const handleLogin = async () => {
              try {
                await signInWithGoogleCompat();"""

          text, login_view_count = (
              login_view_pattern.subn(
                  login_view_replacement,
                  text,
                  count=1
              )
          )

          if login_view_count != 1:
              raise SystemExit(
                  "ERRO: botão de login da tela inicial "
                  "não foi encontrado."
              )

          # Alterar o segundo botão de login existente no aplicativo.
          google_login_pattern = re.compile(
              r"const handleGoogleLogin = async \(\) => \{\s*"
              r"const provider = new GoogleAuthProvider\(\);\s*"
              r"try \{\s*"
              r"await signInWithPopup\(auth,\s*provider\);"
          )

          google_login_replacement = """const handleGoogleLogin = async () => {
              try {
                await signInWithGoogleCompat();"""

          text, google_login_count = (
              google_login_pattern.subn(
                  google_login_replacement,
                  text,
                  count=1
              )
          )

          if google_login_count != 1:
              raise SystemExit(
                  "ERRO: segundo botão de login Google "
                  "não foi encontrado."
              )

          # Encerrar sessão nativa e sessão Firebase JavaScript.
          sign_out_pattern = re.compile(
              r"const handleSignOut\s*=\s*"
              r"\(\)\s*=>\s*signOut\(auth\);"
          )

          new_sign_out = """const handleSignOut = async () => {
              if (Capacitor.isNativePlatform()) {
                try {
                  await FirebaseAuthentication.signOut();
                } catch (error) {
                  console.warn(
                    'Não foi possível encerrar a sessão nativa:',
                    error
                  );
                }
              }

              await signOut(auth);
            };"""

          text, sign_out_count = sign_out_pattern.subn(
              new_sign_out,
              text,
              count=1
          )

          if sign_out_count != 1:
              raise SystemExit(
                  "ERRO: função de sair não foi encontrada."
              )

          app_path.write_text(
              text,
              encoding="utf-8"
          )

          # Configurar persistência da sessão Firebase no Android.
          firebase_path = Path("src/lib/firebase.ts")

          if not firebase_path.exists():
              raise SystemExit(
                  "ERRO: src/lib/firebase.ts não foi encontrado."
              )

          firebase_text = firebase_path.read_text(
              encoding="utf-8"
          )

          firebase_import_pattern = re.compile(
              r"import\s*\{\s*getAuth\s*\}\s*"
              r"from\s*['\"]firebase/auth['\"]\s*;"
          )

          new_firebase_import = """import {
            getAuth,
            indexedDBLocalPersistence,
            initializeAuth
          } from 'firebase/auth';
          import { Capacitor } from '@capacitor/core';"""

          firebase_text, firebase_import_count = (
              firebase_import_pattern.subn(
                  new_firebase_import,
                  firebase_text,
                  count=1
              )
          )

          if firebase_import_count != 1:
              raise SystemExit(
                  "ERRO: import getAuth não foi encontrado "
                  "em firebase.ts."
              )

          auth_export_pattern = re.compile(
              r"export\s+const\s+auth\s*=\s*"
              r"getAuth\(app\)\s*;"
          )

          new_auth_export = """export const auth =
            Capacitor.isNativePlatform()
              ? initializeAuth(app, {
                  persistence: indexedDBLocalPersistence
                })
              : getAuth(app);"""

          firebase_text, auth_export_count = (
              auth_export_pattern.subn(
                  new_auth_export,
                  firebase_text,
                  count=1
              )
          )

          if auth_export_count != 1:
              raise SystemExit(
                  "ERRO: inicialização do Firebase Auth "
                  "não foi encontrada."
              )

          firebase_path.write_text(
              firebase_text,
              encoding="utf-8"
          )

          print("Import Firebase Auth atualizado.")
          print(
              "Login inicial atualizado:",
              login_view_count
          )
          print(
              "Segundo login atualizado:",
              google_login_count
          )
          print(
              "Função de sair atualizada:",
              sign_out_count
          )
          print(
              "Persistência Firebase configurada:",
              auth_export_count
          )
          print(
              "Login Google Android adaptado com sucesso."
          )
          PY

      - name: Compilar aplicativo web
        run: npm run build

      - name: Criar projeto Android
        run: |
          rm -rf android

          npx cap add android

          if [ ! -f "google-services.json" ]; then
            echo "ERRO: google-services.json não foi encontrado."
            exit 1
          fi

          cp google-services.json \
            android/app/google-services.json

          python3 <<'PY'
          from pathlib import Path

          variables_path = Path(
              "android/variables.gradle"
          )

          if not variables_path.exists():
              raise SystemExit(
                  "ERRO: android/variables.gradle "
                  "não foi encontrado."
              )

          variables_text = variables_path.read_text(
              encoding="utf-8"
          )

          if "rgcfaIncludeGoogle" not in variables_text:
              variables_text += """

          ext {
              rgcfaIncludeGoogle = true
              androidxCredentialsVersion = '1.3.0'
          }
          """

              variables_path.write_text(
                  variables_text,
                  encoding="utf-8"
              )

          print(
              "Dependências nativas do Google configuradas."
          )
          PY

          npx cap update android
          npx cap sync android

      - name: Verificar configuração Firebase Android
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERRO: google-services.json não foi copiado."
            exit 1
          fi

          grep -q '"com.jsonia.appeden"' \
            android/app/google-services.json

          grep -q "rgcfaIncludeGoogle" \
            android/variables.gradle

          grep -q "androidxCredentialsVersion" \
            android/variables.gradle

          echo "Configuração Firebase Android confirmada."

      - name: Restaurar chave de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERRO: Secret ANDROID_KEYSTORE_BASE64 ausente."
            exit 1
          fi

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "ERRO: Secret ANDROID_KEYSTORE_PASSWORD ausente."
            exit 1
          fi

          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "ERRO: Secret ANDROID_KEY_ALIAS ausente."
            exit 1
          fi

          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ERRO: Secret ANDROID_KEY_PASSWORD ausente."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/app-eden-upload.jks

          keytool -list \
            -keystore android/app/app-eden-upload.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            > /dev/null

          echo "Chave de assinatura restaurada."

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK assinado
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            "-Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/app-eden-upload.jks" \
            "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"

      - name: Verificar e preparar APK
        run: |
          mkdir -p saida

          APK_ORIGINAL=$(find \
            android/app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_ORIGINAL" ]; then
            echo "ERRO: APK não foi encontrado."
            exit 1
          fi

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          if [ -z "$BUILD_TOOLS" ]; then
            echo "ERRO: Android Build Tools não encontrado."
            exit 1
          fi

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK_ORIGINAL"

          cp "$APK_ORIGINAL" \
            saida/App-Eden-release.apk

          echo "APK assinado e verificado com sucesso."

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Eden-APK-Assinado
          path: saida/App-Eden-release.apk
          retention-days: 30
          if-no-files-found: error
